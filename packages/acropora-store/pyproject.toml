[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acropora-store"
version = "0.1.0"
description = "Acropora storage layer — TimescaleDB, Parquet archival, query engine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Acropora Project Contributors" }]
keywords = ["acropora", "coral-network", "reef-protocol", "spatiotemporal", "timescaledb"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "asyncpg>=0.29",
    "duckdb>=0.10",
    "pyarrow>=16.0",
    "pynacl>=1.5",
]

[project.urls]
Homepage = "https://acropora.network"
Repository = "https://github.com/acropora-project/acropora"
Documentation = "https://acropora.dev"

[tool.hatch.build.targets.wheel]
packages = ["src/acropora_store"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
]