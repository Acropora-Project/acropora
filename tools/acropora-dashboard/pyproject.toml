[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acropora-dashboard"
version = "0.1.0"
description = "Acropora node dashboard — local operator web UI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Acropora Project Contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://acropora.network"
Repository = "https://github.com/acropora-project/acropora"

[tool.hatch.build.targets.wheel]
packages = ["src/acropora_dashboard"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "httpx>=0.27",
]