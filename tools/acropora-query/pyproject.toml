[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acropora-query"
version = "0.1.0"
description = "Acropora CLI — query the CORAL network from the command line"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Acropora Project Contributors" }]
keywords = ["acropora", "coral-network", "cli", "adsb"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "acropora-client>=0.1.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
acropora = "acropora_query.cli:main"
acro     = "acropora_query.cli:main"

[project.urls]
Homepage = "https://acropora.network"
Repository = "https://github.com/acropora-project/acropora"

[tool.hatch.build.targets.wheel]
packages = ["src/acropora_query"]

[tool.uv.sources]
acropora-client = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]